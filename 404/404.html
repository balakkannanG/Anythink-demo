    /* =========================================
       PINNED SECTION
    ========================================= */

    .mobile-card-scroll {
        position: relative;

        width: 100%;

        height: 100svh;
        min-height: 100svh;

        overflow: hidden;

        background: #000;

        z-index: 10;
    }


    /* =========================================
       CARD STACK
    ========================================= */

    .mobile-card-scroll .mobile-scroll-card {

        position: absolute !important;

        top: 40% !important;
        left: 50% !important;

        width: calc(100% - 40px) !important;

        margin: 0 !important;

        transform: translateX(-50%);

        backface-visibility: hidden;

        transform-origin: center center;

}</style><script>document.addEventListener("DOMContentLoaded", function () {

    gsap.registerPlugin(ScrollTrigger);


    function initMobileCardScroll() {

        /* =========================================
           MOBILE ONLY
        ========================================= */

        if (window.innerWidth > 767) {
            return;
        }


        const section = document.querySelector(
            ".mobile-card-scroll"
        );

        if (!section) return;


        const cards = gsap.utils.toArray(
            ".mobile-card-scroll .mobile-scroll-card"
        );

        if (!cards.length) return;


        /* =========================================
           INITIAL CARD POSITION
        ========================================= */

        cards.forEach((card, index) => {

            if (index === 0) {

                gsap.set(card, {
                    y: 0,
                    scale: 1,
                    opacity: 1,
                    zIndex: 100
                });

            } else {

                gsap.set(card, {
                    y: window.innerHeight,
                    scale: 1,
                    opacity: 1,
                    zIndex: 100 + index
                });

            }

        });


        /* =========================================
           CREATE TIMELINE
        ========================================= */

        const tl = gsap.timeline();


        /* =========================================
           FIRST CARD HOLD
        ========================================= */

        tl.to({}, {
            duration: 0.5
        });


        /* =========================================
           CARD TRANSITIONS
        ========================================= */

        cards.forEach((card, index) => {

            if (index === 0) return;


            const previousCard =
                cards[index - 1];


            /* NEW CARD → FRONT */

            tl.set(card, {
                zIndex: 1000 + index
            });


            /* NEW CARD COMES FROM BOTTOM */

            tl.to(
                card,
                {
                    y: 0,
                    scale: 1,
                    opacity: 1,
                    duration: 1,
                    ease: "power3.out"
                }
            );


            /* PREVIOUS CARD MOVES UP */

            tl.to(
                previousCard,
                {
                    y: -70,
                    scale: 0.94,
                    duration: 1,
                    ease: "power2.inOut"
                },
                "<"
            );

        });


        /* =========================================
           FINAL CARD SETTLE
        ========================================= */

        tl.to({}, {
            duration: 0.8
        });


        /* =========================================
           SCROLLTRIGGER
        ========================================= */

        const trigger = ScrollTrigger.create({

            animation: tl,

            trigger: section,

            start: "top top",


            /*
             * Timeline duration:
             *
             * 0.5
             * + card transitions
             * + 0.8 final settle
             *
             * Give each timeline unit
             * a viewport of scroll.
             */

            end: () => {

                return "+=" + (
                    tl.duration() *
                    window.innerHeight
                );

            },


            /* PIN */

            pin: true,

            pinSpacing: true,


            /* SMOOTH SCRUB */

            scrub: 1.2,


            /* MOBILE */

            anticipatePin: 1,

            invalidateOnRefresh: true,

            fastScrollEnd: false

        });


        return trigger;

    }


    /* =========================================
       INITIALIZE
    ========================================= */

    let mobileTrigger =
        initMobileCardScroll();


    /* =========================================
       RESIZE
    ========================================= */

    let resizeTimer;

    let lastWidth =
        window.innerWidth;


    window.addEventListener(
        "resize",
        function () {

            clearTimeout(resizeTimer);


            resizeTimer = setTimeout(
                function () {

                    const currentWidth =
                        window.innerWidth;


                    /*
                     * Don't rebuild the animation
                     * just because mobile browser
                     * address bar changed height.
                     */

                    if (
                        currentWidth === lastWidth
                    ) {

                        ScrollTrigger.refresh();

                        return;

                    }


                    lastWidth =
                        currentWidth;


                    /* DESKTOP */

                    if (
                        currentWidth > 767
                    ) {

                        if (mobileTrigger) {

                            mobileTrigger.kill();

                            mobileTrigger = null;

                        }

                    }


                    /* MOBILE */

                    else {

                        if (!mobileTrigger) {

                            mobileTrigger =
                                initMobileCardScroll();

                        }

                    }


                    ScrollTrigger.refresh();

                },
                300
            );

        }
    );

});</script><link rel="icon" href="/wp-content/uploads/2025/12/Favicon.svg" sizes="32x32">
